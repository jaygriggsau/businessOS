name: Build Windows app

# Builds the businessOS Windows .exe (installer + portable) on GitHub's
# Windows runners. Download the results from the run's "Artifacts" section.
#
# A GitHub Release (with the .exe files as plain downloads) is published when
# either:
#   - a version tag like v0.1.0 is pushed, or
#   - this workflow is run manually with "Publish a GitHub Release" enabled
#     (Actions tab -> Build Windows app -> Run workflow).
# The release is tagged with the version from package.json.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the .exe files'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Windows app
        run: npm run dist
        env:
          # electron-builder should not try to publish on its own; we handle
          # releases via the upload step below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: businessOS-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: businessOS v${{ steps.version.outputs.value }}
          files: release/*.exe
          generate_release_notes: true
